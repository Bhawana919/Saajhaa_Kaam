<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6B7561"/></marker></defs><rect width="100%" height="100%" fill="#F6F4EE"/><text x="54" y="66" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start">Information flow</text><text x="54" y="99" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Consent and payment status are explicit · money never passes through the demo application</text><rect x="50" y="170" width="300" height="155" rx="12" fill="#FFFFFF" stroke="#D5D1C7" stroke-width="1"/><rect x="50" y="170" width="5" height="155" rx="0" fill="#A64C32" stroke="#A64C32" stroke-width="0"/><text x="72" y="205" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">1. Talent</text><text x="72" y="237" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Select one proof sample</text><text x="72" y="264" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Consent to share · apply</text><rect x="420" y="170" width="300" height="155" rx="12" fill="#FFFFFF" stroke="#D5D1C7" stroke-width="1"/><rect x="420" y="170" width="5" height="155" rx="0" fill="#A64C32" stroke="#A64C32" stroke-width="0"/><text x="442" y="205" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">2. API + DB</text><text x="442" y="237" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Authorize ownership</text><text x="442" y="264" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Save application + outbox</text><rect x="790" y="170" width="300" height="155" rx="12" fill="#FFFFFF" stroke="#D5D1C7" stroke-width="1"/><rect x="790" y="170" width="5" height="155" rx="0" fill="#A64C32" stroke="#A64C32" stroke-width="0"/><text x="812" y="205" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">3. Client</text><text x="812" y="237" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Review proof + offer</text><text x="812" y="264" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Set price / scope / rights</text><rect x="50" y="420" width="300" height="155" rx="12" fill="#FFFFFF" stroke="#D5D1C7" stroke-width="1"/><rect x="50" y="420" width="5" height="155" rx="0" fill="#A64C32" stroke="#A64C32" stroke-width="0"/><text x="72" y="455" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">4. Both parties</text><text x="72" y="487" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Accept frozen terms</text><text x="72" y="514" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Submit and review work</text><rect x="50" y="680" width="300" height="155" rx="12" fill="#FFFFFF" stroke="#D5D1C7" stroke-width="1"/><rect x="50" y="680" width="5" height="155" rx="0" fill="#A64C32" stroke="#A64C32" stroke-width="0"/><text x="72" y="715" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">5. Support</text><text x="72" y="747" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Human case if needed</text><text x="72" y="774" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Evidence, response, appeal</text><rect x="790" y="420" width="300" height="155" rx="12" fill="#FFFFFF" stroke="#D5D1C7" stroke-width="1"/><rect x="790" y="420" width="5" height="155" rx="0" fill="#A64C32" stroke="#A64C32" stroke-width="0"/><text x="812" y="455" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">6. External partner</text><text x="812" y="487" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Real launch only: receipt</text><text x="812" y="514" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Signed event + reconciliation</text><rect x="420" y="680" width="300" height="125" rx="12" fill="#FFFFFF" stroke="#D5D1C7" stroke-width="1"/><rect x="420" y="680" width="5" height="125" rx="0" fill="#A64C32" stroke="#A64C32" stroke-width="0"/><text x="442" y="715" fill="#252A25" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">7. Work Passport</text><text x="442" y="747" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Source-labeled claim</text><text x="442" y="774" fill="#6B7561" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Export / revoke shared link</text><path d="M350,247 L420,247" fill="none" stroke="#6B7561" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M720,247 L790,247" fill="none" stroke="#6B7561" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M940,325 L200,420" fill="none" stroke="#6B7561" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M200,575 L200,680" fill="none" stroke="#6B7561" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M350,530 L